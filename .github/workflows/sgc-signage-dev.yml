name: SGC signage dev build

on:
  push:
    branches:
      - dev/sgc-configurable-signage
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Make wrapper executable
        run: chmod +x gradlew
      - name: Compile and build
        run: ./gradlew clean build compileGameTestJava --stacktrace
      - name: Upload dev jar
        uses: actions/upload-artifact@v4
        with:
          name: bulkhead-engineering-sgc-signage-dev
          path: build/libs/*.jar
          if-no-files-found: error
